name: selfhost-db-migrate

# Cal.com Prisma migrations do NOT auto-run on Vercel (calcom#23958). This applies any pending
# migrations to the Neon database whenever migration files or the schema change on main.
# Also runnable on demand via the Actions tab ("Run workflow").
#
# Requires repo secrets: DATABASE_URL (pooled) and DATABASE_DIRECT_URL (direct/Neon).
# Note: for schema-breaking upgrades, coordinate with the Vercel deploy (run this first).

on:
  push:
    branches: [main]
    paths:
      - "packages/prisma/migrations/**"
      - "packages/prisma/schema.prisma"
  workflow_dispatch:

concurrency:
  group: db-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: prisma migrate deploy
        run: npx --yes prisma@6.16.1 migrate deploy --schema=packages/prisma/schema.prisma
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_DIRECT_URL: ${{ secrets.DATABASE_DIRECT_URL }}
